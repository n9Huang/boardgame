<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>山中小屋 — 事件卡</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Ma+Shan+Zheng&family=Uncial+Antiqua&display=swap" rel="stylesheet" />
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <style>
    :root {
      --bg:         #080810;
      --card-dark:  #0e0c0a;
      --border:     #8a6a28;
      --gold:       #c8a84b;
      --gold-glow:  rgba(200,168,75,0.35);
      --text:       #d4c5a9;
      --muted:      #6e6050;
      --rule-bg:    #091409;
      --rule-text:  #7ac87a;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { overscroll-behavior: none; }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg);
      background-image:
        radial-gradient(ellipse at 20% 20%, rgba(80,40,10,0.18) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 80%, rgba(20,40,20,0.18) 0%, transparent 60%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      font-family: 'Noto Serif TC', serif;
      color: var(--text);
      overflow-x: hidden;
      overflow-y: auto;
      padding-top: max(24px, env(safe-area-inset-top));
      padding-bottom: max(24px, env(safe-area-inset-bottom));
      user-select: none;
    }

    /* ── 頂部標題 ── */
    .page-header {
      text-align: center;
      margin-bottom: 24px;
      width: 100%;
    }
    .page-title {
      font-family: 'Ma Shan Zheng', 'Noto Serif TC', serif;
      font-size: 36px;
      font-weight: 400;
      color: var(--gold);
      letter-spacing: 12px;
      text-align: center;
      text-shadow: 0 0 24px var(--gold-glow), 0 0 60px rgba(200,168,75,0.15);
      line-height: 1.3;
    }
    .page-sub {
      font-family: 'Uncial Antiqua', serif;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 4px;
      margin-top: 6px;
      text-align: center;
    }

    /* ── 卡片舞台 ── */
    .stage {
      position: relative;
      width: min(300px, 86vw);
      height: min(560px, 62dvh);
      flex-shrink: 0;
    }

    /* ── 卡片包裝 (3D flip) ── */
    .card-wrap {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      perspective: 1200px;
      will-change: transform;
      transition: transform 0.1s ease, box-shadow 0.3s;
      cursor: grab;
    }
    .card-wrap.dragging { cursor: grabbing; transition: none; }
    .card-wrap.flip-anim {
      animation: doFlip 0.65s ease forwards;
    }
    @keyframes doFlip {
      0%   { transform: translateY(var(--drag-end,0px)) rotateY(0deg); }
      45%  { transform: translateY(20px) rotateY(90deg); }
      55%  { transform: translateY(20px) rotateY(90deg); }
      100% { transform: translateY(0px) rotateY(0deg); }
    }

    /* ── 卡片面 ── */
    .card-face {
      position: absolute;
      inset: 0;
      border-radius: 18px;
      border: 1.5px solid var(--border);
      box-shadow: 0 0 30px rgba(0,0,0,0.8), 0 0 8px var(--gold-glow);
      overflow: hidden;
    }

    /* ── 背面 ── */
    #card-back {
      background: var(--card-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .back-ornament {
      width: 180px;
      height: 180px;
      border: 1px solid var(--border);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px var(--gold-glow), inset 0 0 20px rgba(0,0,0,0.5);
    }
    .back-ornament svg { width: 120px; height: 120px; opacity: 0.75; }
    .back-hint {
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 2px;
      animation: hint-pulse 2s ease-in-out infinite;
    }
    @keyframes hint-pulse {
      0%, 100% { opacity: 0.4; } 50% { opacity: 0.85; }
    }
    .back-corner {
      position: absolute;
      width: 28px;
      height: 28px;
      border-color: var(--border);
      border-style: solid;
      opacity: 0.6;
    }
    .back-corner.tl { top: 12px; left: 12px; border-width: 1px 0 0 1px; }
    .back-corner.tr { top: 12px; right: 12px; border-width: 1px 1px 0 0; }
    .back-corner.bl { bottom: 12px; left: 12px; border-width: 0 0 1px 1px; }
    .back-corner.br { bottom: 12px; right: 12px; border-width: 0 1px 1px 0; }

    /* ── 正面 ── */
    #card-front {
      background: linear-gradient(160deg, #0f0d0b 0%, #0a0c0d 100%);
      display: none;
      flex-direction: column;
      padding: 22px 18px 18px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    #card-front.visible { display: flex; }

    .card-type-label {
      font-size: 10px;
      letter-spacing: 3px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .card-title {
      font-family: 'Ma Shan Zheng', 'Noto Serif TC', serif;
      font-size: 28px;
      font-weight: 400;
      color: var(--gold);
      text-shadow: 0 0 16px var(--gold-glow), 0 0 40px rgba(200,168,75,0.12);
      line-height: 1.4;
      min-height: 1.4em;
      letter-spacing: 6px;
      margin-bottom: 14px;
    }

    .divider {
      width: 100%;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--border), transparent);
      margin-bottom: 14px;
      flex-shrink: 0;
    }

    .card-story {
      font-size: 14px;
      line-height: 1.8;
      color: var(--text);
      white-space: pre-wrap;
      flex: none;
    }

    .rule-section {
      display: none;
      margin-top: 14px;
      padding: 12px 14px;
      background: var(--rule-bg);
      border: 1px solid rgba(122,200,122,0.25);
      border-radius: 10px;
      animation: fadeUp 0.4s ease;
    }
    .rule-section.visible { display: block; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .rule-label {
      font-size: 10px;
      letter-spacing: 3px;
      color: rgba(122,200,122,0.6);
      margin-bottom: 8px;
    }
    .rule-text {
      font-size: 13px;
      line-height: 1.8;
      color: var(--rule-text);
      white-space: pre-wrap;
    }

    .tap-hint {
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 2px;
      margin-top: 12px;
      animation: hint-pulse 2s ease-in-out infinite;
      flex-shrink: 0;
    }
    .tap-hint.hidden { display: none; }

    /* ── 下方按鈕 ── */
    .btn-row {
      margin-top: 20px;
      display: flex;
      gap: 12px;
    }
    .btn {
      padding: 10px 24px;
      border-radius: 99px;
      border: 1px solid var(--border);
      background: rgba(200,168,75,0.08);
      color: var(--gold);
      font-size: 14px;
      font-family: inherit;
      letter-spacing: 2px;
      cursor: pointer;
      transition: background 0.2s, box-shadow 0.2s;
    }
    .btn:active {
      background: rgba(200,168,75,0.18);
      box-shadow: 0 0 10px var(--gold-glow);
    }

    /* ── 計數 ── */
    .counter {
      margin-top: 12px;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 2px;
    }

    /* ── 語音按鈕 ── */
    .tts-btn {
      position: absolute;
      top: 10px;
      right: 14px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      opacity: 0.5;
      transition: opacity 0.2s;
      display: none;
    }
    .tts-btn.visible { display: block; }
    .tts-btn:hover { opacity: 0.9; }
    .tts-btn svg { width: 18px; height: 18px; fill: var(--gold); }

    /* ── 設定齒輪按鈕 ── */
    .settings-toggle {
      position: fixed;
      top: max(14px, env(safe-area-inset-top));
      right: max(14px, env(safe-area-inset-right));
      background: none;
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 200;
      opacity: 0.6;
      transition: opacity 0.2s, transform 0.3s;
    }
    .settings-toggle:hover { opacity: 1; }
    .settings-toggle.open { transform: rotate(60deg); }
    .settings-toggle svg { width: 18px; height: 18px; fill: var(--gold); }

    /* ── 設定面板 ── */
    .settings-panel {
      position: fixed;
      top: max(60px, calc(env(safe-area-inset-top) + 46px));
      right: max(10px, env(safe-area-inset-right));
      width: 240px;
      background: #0e0c0a;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 16px;
      z-index: 199;
      box-shadow: 0 8px 32px rgba(0,0,0,0.7);
      display: none;
      flex-direction: column;
      gap: 14px;
    }
    .settings-panel.open { display: flex; }
    .settings-title {
      font-size: 11px;
      letter-spacing: 3px;
      color: var(--gold);
      text-align: center;
      margin-bottom: 2px;
    }
    .setting-row {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .setting-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text);
      letter-spacing: 1px;
    }
    .setting-label span { color: var(--gold); min-width: 30px; text-align: right; }
    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: #2a2015;
      outline: none;
      cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 6px var(--gold-glow);
    }
    .voice-select {
      width: 100%;
      background: #1a1510;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 12px;
      font-family: inherit;
      padding: 6px 8px;
      cursor: pointer;
      outline: none;
    }
    .voice-select option { background: #1a1510; }
    .settings-divider {
      height: 1px;
      background: linear-gradient(to right, transparent, var(--border), transparent);
    }
    .test-btn {
      padding: 7px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(200,168,75,0.07);
      color: var(--gold);
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      letter-spacing: 2px;
      transition: background 0.2s;
    }
    .test-btn:active { background: rgba(200,168,75,0.18); }

    .clear-btn {
      color: #ff8080;
      border-color: rgba(255,107,107,0.4);
      background: rgba(255,107,107,0.07);
    }
    .clear-btn:active { background: rgba(255,107,107,0.18); }

    /* ── 共用返回按鈕元件 ── */
    .back-btn {
      position: fixed;
      top: max(14px, env(safe-area-inset-top));
      left: max(14px, env(safe-area-inset-left));
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: 1px solid var(--border);
      color: var(--gold);
      text-decoration: none;
      z-index: 200;
      opacity: 0.6;
      transition: opacity 0.2s;
    }
    .back-btn:hover { opacity: 1; }
  </style>
</head>
<body>

  <!-- 返回首頁 -->
  <a class="back-btn" href="index.html" aria-label="回首頁">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M15 18l-6-6 6-6"/>
    </svg>
  </a>

  <!-- 設定齒輪 -->
  <button class="settings-toggle" id="settingsToggle" title="語音設定">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96a7.02 7.02 0 0 0-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.477.477 0 0 0-.59.22L2.74 8.87a.47.47 0 0 0 .12.61l2.03 1.58c-.05.3-.07.63-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.37 1.04.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.57 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.47.47 0 0 0-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
    </svg>
  </button>

  <!-- 設定面板 -->
  <div class="settings-panel" id="settingsPanel">
    <div class="settings-title">⟡ 語音設定 ⟡</div>
    <div class="settings-divider"></div>

    <div class="setting-row">
      <div class="setting-label">語速 <span id="rateVal">0.9</span></div>
      <input type="range" id="rateSlider" min="0.5" max="2" step="0.05" value="0.9" />
    </div>

    <div class="setting-row">
      <div class="setting-label">音調 <span id="pitchVal">0.85</span></div>
      <input type="range" id="pitchSlider" min="0.5" max="2" step="0.05" value="0.85" />
    </div>

    <div class="setting-row">
      <div class="setting-label">音量 <span id="volVal">1.0</span></div>
      <input type="range" id="volSlider" min="0" max="1" step="0.05" value="1" />
    </div>

    <div class="settings-divider"></div>

    <div class="setting-row">
      <div class="setting-label">語音角色</div>
      <select class="voice-select" id="voiceSelect"></select>
    </div>

    <button class="test-btn" id="testBtn">試聽</button>

    <div class="settings-divider"></div>

    <button class="test-btn clear-btn" id="clearDeckBtn">清空記錄</button>
  </div>

  <div class="page-header">
    <div class="page-title">山中小屋</div>
    <div class="page-sub">事件卡 · HAUNTING CARDS</div>
  </div>

  <div class="stage">
    <div class="card-wrap" id="cardWrap">

      <!-- 背面 -->
      <div class="card-face" id="card-back">
        <div class="back-corner tl"></div>
        <div class="back-corner tr"></div>
        <div class="back-corner bl"></div>
        <div class="back-corner br"></div>
        <div class="back-ornament">
          <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="60" cy="60" r="50" stroke="#c8a84b" stroke-width="1" stroke-dasharray="4 3"/>
            <circle cx="60" cy="60" r="36" stroke="#c8a84b" stroke-width="0.8"/>
            <path d="M60 24 L64 52 L60 56 L56 52 Z" fill="#c8a84b" opacity="0.7"/>
            <path d="M60 96 L64 68 L60 64 L56 68 Z" fill="#c8a84b" opacity="0.7"/>
            <path d="M24 60 L52 56 L56 60 L52 64 Z" fill="#c8a84b" opacity="0.7"/>
            <path d="M96 60 L68 56 L64 60 L68 64 Z" fill="#c8a84b" opacity="0.7"/>
            <circle cx="60" cy="60" r="6" stroke="#c8a84b" stroke-width="1.5" fill="none"/>
            <line x1="60" y1="10" x2="60" y2="20" stroke="#c8a84b" stroke-width="0.8"/>
            <line x1="60" y1="100" x2="60" y2="110" stroke="#c8a84b" stroke-width="0.8"/>
            <line x1="10" y1="60" x2="20" y2="60" stroke="#c8a84b" stroke-width="0.8"/>
            <line x1="100" y1="60" x2="110" y2="60" stroke="#c8a84b" stroke-width="0.8"/>
          </svg>
        </div>
        <div class="back-hint">↓ 向下拖曳翻牌</div>
      </div>

      <!-- 正面 -->
      <div class="card-face" id="card-front">
        <button class="tts-btn" id="ttsBtn" title="重播語音">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
          </svg>
        </button>
        <div class="card-type-label">— 事件 —</div>
        <div class="card-title" id="cardTitle"></div>
        <div class="divider"></div>
        <div class="card-story" id="cardStory"></div>
        <div class="tap-hint hidden" id="tapHint">點擊卡片查看結果</div>
        <div class="rule-section" id="ruleSection">
          <div class="rule-label">— 規則 —</div>
          <div class="rule-text" id="ruleText"></div>
        </div>
      </div>

    </div>
  </div>

  <div class="btn-row">
    <button class="btn" id="nextBtn">下一張</button>
  </div>
  <div class="counter" id="counter"></div>

<script>
// ── 卡片資料 ──
const CARDS = [
  { title:"迷霧拱門", story:"牆壁裡的一道拱門，被彌散的彩色霧靄填滿。\n\n你可以選擇穿過拱門。將你的人偶從大宅移出並擲3枚骰子：", rule:"骰數0：將你的人偶放在入口大廳。你失去了些東西。棄掉1張物品牌。\n\n骰數1-2：你發生了某些變化。將你的人偶放在入口大廳，把你的人物屬性面板翻面，重置所有屬性到其初始值。\n\n骰數3-4：將你的人偶放入任意一間有打開的門的房間。\n\n骰數5-6：將你的人偶放入任意一間有打開的門的房間并抓一張物品牌。" },
  { title:"約拿的戲耍", story:"兩個小孩正拿着陀螺玩耍。一孩童說：“約拿，你要拋一趟嗎？”\n\n約拿：“不，我只想自己玩！”。約拿手持陀螺大力擊在另一孩童頭上。在一下一下的猛擊間，兩名孩童逐漸消失。", rule:"若你持有“魔術方塊”，則丢弃這些卡牌，并抽回相同數目的“物品牌”。每丢弃1張卡牌，你的“神志”上升1個級別。\n\n若你并未持有“魔術方塊”，則擲骰1粒，其點數即你受到的“精神損傷”。" },
  { title:"今夕是何年？", story:"你跨過門后停了下來。你曾經到過這裡。多年前，還沒有出事時。看到了窗戶反射的影像，你的臉看起來如此的年輕。但是這次，你不會那么天真了。", rule:"“神志”下降1個級別，“力量”和“知識”上升1個級別。\n\n如果真相已被揭露，對立方必須讀出他們的開場與結尾的故事劇情。\n\n如果真相尚未被揭露，則將本卡牌放在你面前，直到真相揭露。" },
  { title:"針灸", story:"房間里令人舒服的點着的蠟燭。一個穿着古樸白袍的長黑發女子向你溫和的微笑着。她拈起了一枚細如發線，長過手掌的針。針尖在燭光下映出一點白芒，如刺入你眼睛一般。\n\n走到一間相鄰的，已被發現的房間中去，你可以選擇讓“神志”下降1個級別，或是以“力量”進行一次“能力考驗”：", rule:"骰數0-2：“速度”和“力量”下降1個級別。\n\n骰數3-4：“速度”和“力量”上升1個級別。\n\n骰數大於等于5：“速度”、“力量”和“神志”上升1個級別。" },
  { title:"腳步聲", story:"地板吱吱作響，塵土激揚。一列清晰的腳印向你而來，在你面前停下並消失。\n\n你需要擲骰1粒（如果你正好在“禮拜堂”，則需擲2粒），以決定后果。", rule:"骰數總和是4：你和離你最近的另一人物兩人的“力量”上升1個級別。\n\n骰數總和是3：你的“力量”上升1個級別。但離你最近的另一人物的“神志”下降1個級別。\n\n骰數總和是2：你的“神志”下降1個級別。\n\n骰數總和是1：你的“速度”下降1個級別。\n\n骰數總和是0：所有人物都需選擇一項“能力”，該“能力”下降1個級別。" },
  { title:"狂暴本質", story:"你身旁的牆壁，涌出大量粘液。\n\n你需要以“速度”進行一次“能力考驗”。", rule:"骰數總和大于等于5：你順利逃脫，你的“速度”上升1個級別。\n\n骰數總和是2至4：你被突如其來的劇變嚇到了。擲骰1粒，其點數即你受到的“精神損傷”。\n\n骰數總和是0至1：你不小心觸碰到了這些惡心的粘液。擲骰1粒，其點數即你受到的“精神損傷”。再擲骰1粒，其點數即你受到的“肉體損傷”。" },
  { title:"鏡中影像", story:"房中古老的大鏡中映着驚惶失措的你。忽然間你悟到鏡中的是另一時空的自己，而你發現可透過鏡傳還一件物品。你決定幫助鏡子那邊的你，于是你在鏡面上寫了：救命用！并將一件物品送往鏡的另一面。", rule:"此卡牌只影響持有“物品牌”的人物。若抽到此牌的你并无“物品牌”，則將此牌傳給左方持有“物品牌”的玩家。若所有玩家都无“物品牌”，則丢弃此牌。\n\n將你的1張“物品牌”放回物品牌叠洗混。你的“知識”上升1個級別。" },
  { title:"隱藏通道", story:"一部分牆壁滑開，其后露出一條充滿霉味的通道。將“隱藏通道”標記放到這個房間。擲骰3粒決定“隱藏通道”通往何處。", rule:"骰數总和是6：任何已放置的房間。\n\n骰數总和是4至5：任何已放置的“樓上”房間。\n\n骰數总和是2至3：任何已放置的“地面”房間。\n\n骰數总和是0至1：任何已放置的“地下”房間。\n\n將另一“隱藏通道”標記放到通道另一端的房間。之后任何人物皆可利用“隱藏通道”往返于兩個房間。你可以即時通過此通道到達對面的房間。" },
  { title:"墓土", story:"這房間布滿一層厚厚的灰塵。飛揚的塵土沾上你身，吸入你肺里。\n\n你需以“力量”進行“能力考驗”。", rule:"骰數总和大於等于4：你將塵土掃除。你的“力量”上升1個級別。\n\n骰數总和是0至3：你感到十分不適。你保留這張卡牌。保留這卡牌期間，你開始回合前，你即受到1點“肉體損傷”。只有當使用“物品牌”成功增加任何一項你的“能力”后，或你停留在“露臺”、“庭院”、“墓園”、“健身房”、“食品儲藏庫”、“天井”或“塔樓”后，你方可丢弃此牌。" },
  { title:"滴答... 滴答... 滴答...", story:"這房間發出一些在你腦海中如針刺般的節奏聲音。", rule:"將“水滴”標記放到這房間上。任何人物在這房間內進行任何“能力考驗”時，將少擲1粒游戲骰（骰子數目最少仍有1粒）。襲擊不是“能力考驗”，不受“水滴”影響。" },
  { title:"葬禮", story:"你見到一副棺材，躺在棺木中的正是你自己。\n\n你需以“神志”進行“能力考驗”。", rule:"骰數总和大於等于4：眨眼間，棺材不見了。你的“神志”上升1個級別。\n\n骰數总和是2至3：你深感困擾，你的“神志”下降1個級別。\n\n骰數总和是0至1：你發現自己正躺在棺材中。奮力從棺材中爬起來時，你的“力量”及“神志”皆下降1個級別。若“墓園”或“地窖”已經出現，則你會處于“墓園”或“地窖”。若兩個地方皆在，則由你選擇其一。" },
  { title:"呢喃聲", story:"“吾在地下，埋于土中”。一個聲音在你耳邊響起，隨即消失無聲。\n\n你需以“知識”進行“能力考驗”。", rule:"骰數总和大於等于4：你在地板下發現某樣東西。你可抽取1張“物品牌”。\n\n骰數总和是0至3：你四處搜掘但一無所獲。" },
  { title:"窺視未來", story:"你頹然倒在地上，迷糊間腦海中泛起一些似是未來影像。", rule:"你可揀選執行下列兩項中的一項。\n\n— 可窺看某一牌堆／房間中最上面3張。抽取3張卡牌和房間，在檢視后可改變其排列順序。將這些卡牌或房間放回至牌叠或房間叠的最頂處。\n\n— 你可擲4顆，將此擲骰結果寫下。在以后的游戲中，你可以放棄一次擲骰，直接把寫下的數字作擲骰結果。若數字大于某事件 結果範圍。則作最大骰數處理。" },
  { title:"左手", story:"你的手開始發癢，灼燒。痛苦難以忍受，你只能抓住手發出無計可施的尖叫。當你意識到你已經感覺不到任何東西時，尖叫夭折在你的喉嚨口。你打算動一下你的手指，而手卻自己向你的咽喉伸了過來", rule:"選擇其中之一：\n\n• 切掉你的手。“力量”下降1個級別，“神志”上升1個級別。\n\n• 替換你的手。“力量”下降1個級別，抽取1張物品牌。\n\n• 留下你的手。“神志”下降2個級別，“力量”上升1個級別，隨后移動到最近的一個擁有“預兆”圖案的房間并抽一張預兆牌。" },
  { title:"自由的呼喚", story:"外面！你必須到外面去！自由的飛翔吧！\n\n所有身處“庭院”、“墓園”、“塔樓”、“露臺”、或擁有向外窗戶的房間的人物，皆需以“神志”進行“能力考驗”。", rule:"骰數总和大於等于3：你在窗臺上打住了這念頭。\n\n骰數总和是0至2：你縱身跳落至“天井”。你身處“天井”，若“天井”尚未翻開，則從尚未放置的房間中找出“天井”并擺放，重新洗混未放置的房間。擲骰1粒，其點數即你受到的“肉體損傷”。\n\n每個人物只需承受自己“能力考驗”的后果。" },
  { title:"旋轉牆壁", story:"一堵偽裝成牆壁的旋轉門。將“開關”標記放到這房間中一堵沒有“門扉”的牆壁上。若裝上旋轉門的另一邊沒有房間，則如探險般放置同一樓層的房間到這轉門的另一邊，你進入這新房間。若這樓層並無未放置的房間，則丟棄“開關”標記。\n\n任何在旋轉門兩邊房間的人物，皆可嘗試使用旋轉門往返這兩個房間。人物需以“知識”進行“能力考驗”。", rule:"骰數总和大於等于3：人物找到旋轉門並成功通過它。\n\n骰數总和是0至2：人物沒有找到旋轉門的開關。" },
  { title:"亡骸", story:"一對可憐的母子在地下仍互相擁抱着。將“骸骨”標記放到這房間上。你需要擲骰1粒，其點數即是你受到的“精神損傷”。\n\n任何身處這房間的人物都可進行搜尋，以“神志”進行“能力考驗”。", rule:"骰數总和大於等于5：你找到這對母子的骸骨。你抽1張“物品牌”并丢弃“骸骨”標記。\n\n骰數总和是0至4：你四處搜掘但一無所獲。擲骰1粒，其點數即你受到的“精神損傷”。\n\n只有進行搜尋的人物才需承受行動的后果。" },
  { title:"機器里的鬼魂", story:"突如其來的響聲從電視里來。通過布滿雪花的圖像，你發現一個孩子的影像在大宅的某處玩耍。她停下了並轉向你，招呼你也來加入她。電視機重新暗了下去\n\n你需以“神志”進行“能力考驗”。", rule:"骰數0-2：“力量”下降1個級別。將這張牌放在你面前。所有探險者每回合只能移動1格，持續到你的下一回合開始時，然后弃掉本卡牌。\n\n骰數大於等于3：從房間板塊堆抓取1張屋頂樓層的板塊放入大宅并將你的人偶在其上。" },
  { title:"牆上霧靄", story:"牆壁上涌現不明的霧靄。霧靄中隱約藏有多個面孔，有人類的...亦有異類的。\n\n所有身處“地下”的人物皆需要以“神志”進行“能力考驗”。", rule:"骰數总和大於等于4：那些面孔只是光影的錯覺，一切無恙。\n\n骰數总和是1至3：你需擲骰1粒。若你身處的房間印有“事件（漩渦）”標記，則你共需擲骰2粒，其點數即人物所受到的“精神損傷”數。\n\n骰數总和是0：你需擲骰1粒。若你身處的房間印有“事件（漩渦）”標記，則你共需擲骰3粒，其點數即人物所受到的“精神損傷”數。\n\n每個人物只需承受自己“能力考驗”的后果。" },
  { title:"希望涌現", story:"這里彌漫着祥和的氣息，這氣息抗拒着邪惡。", rule:"將“祝福”標記放到這房間上。\n\n所有人物（不包括“奸徒”）在這房間進行任何“能力考驗”時，可多擲1粒游戲骰（骰子數目最多8粒）。\n\n進行襲擊不是“能力考驗”，不受到“祝福”。" },
  { title:"園丁", story:"你轉身看到一男子身穿園丁服飾，手持鐵鏟向你沖來。當鐵鏟到你面前時，卻什么也没發生，地上只留有污泥的腳印。\n\n你需要以“知識”進行“能力考驗”。若你身處“庭院”，則少擲2粒骰子。", rule:"骰數总和大於等于4：你在泥土中發現某物，你可抽1張“物品牌”。\n\n骰數总和是1至2：園丁突然重現在你面前，鐵鏟正敲向你頭部。這是一個4點“力量”的襲擊，由你右方的另一玩家擲4粒骰子。" },
  { title:"保險箱", story:"在一幅人像畫后，你發現了一個鎖上的保險箱。將“保險箱”標記放到這房間上。\n\n任何身處房間的人物都可以“知識”進行“能力考驗”，來嘗試打開這保險箱。", rule:"骰數总和大於等于5：成功打開保險箱！抽2張“物品牌”并丢弃“保險箱”標記。\n\n骰數总和是2至4：嘗試開啟時你扭傷了手腕。擲骰1粒，其點數即是你受到的“肉體損傷”。\n\n骰數总和是0至1：你憤怒的用拳頭砸向保險箱，但并未對其造成任何傷害。擲骰2粒，其點數即是你受到的“肉體損傷”。" },
  { title:"亂葬堆", story:"一堆石塊覆蓋着一具新鮮的尸體。太新鮮了。", rule:"將亂葬堆標志放在該房間。在真相被揭露后，當探險者離開這個房間時，尸體會爬起進行攻擊。該探險者右手邊的玩家，向該探險者發起一次“力量”為4的攻擊。如果該探險者以大於等于3點的優勢獲勝，則可弃掉亂葬堆標志物。" },
  { title:"壁櫃門", story:"壁櫃的櫃門微開一條縫，裡面應該有些東西。將“壁櫃”標記放到這房間。任何身處這房間的人都可打開這壁櫃。\n\n擲2粒骰子決定后果。", rule:"骰數总和等于4：抽取1張物品牌。\n\n骰數总和是2至3：翻開1張事件牌。\n\n骰數总和是0至1：翻開1張事件牌并丢弃“壁櫃”標記。" },
  { title:"煙霧", story:"濃煙滾滾地從四處涌現。你流着淚水，喉頭刺痛。", rule:"將“煙霧”標記放到這房間上。這濃煙如牆壁般阻礙視線。房間外的人物無法看到這房間內的事物。人物在這房間內進行任何“能力考驗”時，將少擲2粒游戲骰（骰子數目最少仍有1粒）。\n\n進行襲擊不是“能力考驗”，不受“煙霧”影響。" },
  { title:"絲網", story:"沿路你撥掃一個蜘蛛網，但這些絲綫緊緊的粘着你。\n\n你需要以“力量”進行“能力考驗”。", rule:"骰數总和大於等于4：你掙脫了蜘蛛網。你的“力量”上升1個級別。\n\n骰數总和是0至3：你給纏着了。你保留這張卡牌。保留期間，不可進行任何行動，也不可使用物品。其它進入這房間的人物，能以“力量”進行“能力考驗”來解救被困的你。若擲出的點數總和是4或以上；被困的你重獲自由。\n\n3次解救失敗後，被困的你也會重獲自由。自由后丟弃此牌。\n\n你同樣可在自己的回合嘗試解救自己。若成功，下回合才可如常行動。" },
  { title:"鏡中影像（第二張）", story:"房中古老的大鏡中映着驚惶失措的你。忽然間你悟到鏡中的是另一時空的自己，而鏡中的你在鏡面上寫下了：\n\n救命用！\n\n并且手里拿着一件物品伸向你。", rule:"你抽取1張物品牌。" },
  { title:"凶邪玩偶", story:"這房內有一排的玩偶，你爲其中一個透着凶狠而感到馱然。這玩偶突然躍起，手拿小矛刺向你。\n\n這是一個針對你的4點“力量”襲擊，由你右方另一位玩家代擲4粒骰。", rule:"若你勝出這場比拼，則該卡牌無效。\n\n若你受到“肉體損傷”，則持有“戈矛”的人物“力量”上升2個級別。若持有“戈矛”的人物正好是你，則無此效果。" },
  { title:"牆上有眼", story:"一組褪色的肖像挂在牆上。他們的眼睛看上去正盯着你。這只是畫家的技法嗎？不，這安静的，了無生氣的臉龐正準備告訴你一些事情\n\n你需以“神志”進行“能力考驗”。", rule:"骰數0-2：“神志”下降1個級別。\n\n骰數3：“知識”上升1個級別。\n\n骰數大於等于4：如果“軍火庫”在遊戲中，則將你的人偶放到它上面并摸取一張物品牌；否則就將“軍火庫”找出來并放置在大宅中并將你的人偶在其上，隨后洗混房間板塊堆。" },
  { title:"神秘滑道", story:"這卡牌只影響非身處于“地下”的人物。若你正處于“地下”，則將這牌傳給左方身處于“地下”的玩家。若所有玩家都身處于“地下”，則丢弃此牌。\n\n你腳下的地板忽然松開將“滑道”標記放到這房間上，你需以“力量”進行“能力考驗”。", rule:"骰數总和大於等于5：你成功操控滑道。你可墜落到任何樓層較低的房間內。\n\n骰數总和是0至4：你急墜至最深處。擲骰1粒，骰數即為你受到的“肉體損傷”數。而后如探險般，翻開一間在“地下”的房間，你將墜落至該房間。\n\n若沒有未翻開的“地下”房間，則你可墜落至任何一個“地下”房間。若并非在你的回合，不可在新房間抽卡。" },
  { title:"焦慮的響聲", story:"遺弃嬰兒的喊聲、高聲的尖叫、玻璃破裂聲、然后一片寂靜。\n\n你需擲骰6粒。", rule:"若其點數和大於等于翻開的預兆牌數目，則你的“神志”上升1個級別。\n\n否則擲骰1粒，其點數即你受到的“精神損傷”。" },

  { title:"變異寵物", story:"一聲“喵”。來自牆內。是只貓嗎？第二聲號叫從牆內的同一個位置迸發而出，不一樣的貓科動物的聲音。兩只貓？你只聽見一個刮擦聲。兩個頭？你扒開牆泥來探求究竟\n\n你需以“速度”進行“能力考驗”", rule:"擲出的骰數需要大於等于4。如果失敗了，被寵物抓到，受到1點肉體損傷；成功的話，“神志”和“速度”上升1個級別。" },

// ── 狀態 ──
let deck = [];        // 剩餘牌堆 (index)
let currentCard = null;
let state = 'back';   // 'back' | 'story' | 'rule'
let typewriterTimer = null;
let ttsUtterance = null;
let storyReady = false; // story 文字是否已打完，避免打字中被提早點擊打斷

// ── 元素 ──
const cardWrap   = document.getElementById('cardWrap');
const cardBack   = document.getElementById('card-back');
const cardFront  = document.getElementById('card-front');
const cardTitle  = document.getElementById('cardTitle');
const cardStory  = document.getElementById('cardStory');
const ruleSection= document.getElementById('ruleSection');
const ruleText   = document.getElementById('ruleText');
const tapHint    = document.getElementById('tapHint');
const ttsBtn     = document.getElementById('ttsBtn');
const nextBtn    = document.getElementById('nextBtn');
const counter    = document.getElementById('counter');

// ── 洗牌 ──
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

const DECK_STORAGE_KEY = 'cabin_deck_v1';

function loadDeck() {
  try {
    const raw = localStorage.getItem(DECK_STORAGE_KEY);
    if (!raw) return null;
    const arr = JSON.parse(raw);
    if (Array.isArray(arr) && arr.every((i) => Number.isInteger(i) && i >= 0 && i < CARDS.length)) {
      return arr;
    }
  } catch (e) { /* 忽略壞資料，改洗新牌堆 */ }
  return null;
}

function saveDeck() {
  localStorage.setItem(DECK_STORAGE_KEY, JSON.stringify(deck));
}

function resetDeck() {
  deck = shuffle([...Array(CARDS.length).keys()]);
  saveDeck();
}

function updateCounter() {
  counter.textContent = `剩餘 ${deck.length} / ${CARDS.length} 張`;
}

// ── 打字機效果 ──
function typewrite(el, text, speed, onDone) {
  if (typewriterTimer) clearInterval(typewriterTimer);
  el.textContent = '';
  let i = 0;
  typewriterTimer = setInterval(() => {
    el.textContent += text[i];
    i++;
    if (i >= text.length) {
      clearInterval(typewriterTimer);
      typewriterTimer = null;
      if (onDone) onDone();
    }
  }, speed);
}

// ── TTS 設定 ──
let ttsRate  = 0.9;
let ttsPitch = 0.85;
let ttsVol   = 1.0;
let ttsVoice = null;

function speak(text, onDone) {
  if (!window.speechSynthesis) { if (onDone) onDone(); return; }
  window.speechSynthesis.cancel();

  // ── 文字預處理，讓語音更自然 ──
  const cleaned = preprocessTTS(text);

  // 依停頓符號分段，每段之間加入停頓
  const segments = splitSegments(cleaned);
  if (!segments.length) { if (onDone) onDone(); return; }

  let idx = 0;
  function speakNext() {
    if (idx >= segments.length) { if (onDone) onDone(); return; }
    const { txt, pause } = segments[idx++];
    if (!txt) { setTimeout(speakNext, pause); return; }

    const utt = new SpeechSynthesisUtterance(txt);
    utt.lang   = 'zh-TW';
    utt.rate   = ttsRate;
    utt.pitch  = ttsPitch;
    utt.volume = ttsVol;
    if (ttsVoice) utt.voice = ttsVoice;
    utt.onend = () => setTimeout(speakNext, pause);
    utt.onerror = () => setTimeout(speakNext, pause);
    ttsUtterance = utt;
    window.speechSynthesis.speak(utt);
  }
  speakNext();
}

// ── 文字清理：讓 TTS 念起來更自然 ──
function preprocessTTS(text) {
  return text
    .replace(/⋯+/g, '……')            // 標準化省略號
    .replace(/\((\d+)\+\)/g, '')      // 移除骰子判定 (5+) 等符號
    .replace(/\((\d+)-(\d+)\)/g, '')  // 移除 (0-4) 等範圍符號
    .replace(/\n+/g, '，')            // 換行轉逗號停頓
    .replace(/[「」『』【】〔〕]/g, '') // 移除書名號干擾
    .replace(/，+/g, '，')            // 合併多餘逗號
    .trim();
}

// ── 依標點分段，附帶停頓毫秒 ──
function splitSegments(text) {
  const segs = [];
  // 用正規表達式切在句號、驚嘆號、問號、省略號、逗號後
  const parts = text.split(/(。|！|？|……|，)/);
  let buf = '';
  for (let i = 0; i < parts.length; i++) {
    const p = parts[i];
    if (!p) continue;
    if (/^(。|！|？|……|，)$/.test(p)) {
      buf += p;
      let pause = 120;
      if (/[。！？]/.test(p)) pause = 480;
      else if (/……/.test(p))  pause = 680;
      else if (/，/.test(p))  pause = 160;
      if (buf.replace(/[。！？……，]/g, '').trim()) {
        segs.push({ txt: buf.trim(), pause });
      }
      buf = '';
    } else {
      buf += p;
    }
  }
  if (buf.trim()) segs.push({ txt: buf.trim(), pause: 0 });
  return segs;
}

function replayTTS() {
  if (!currentCard) return;
  speak(currentCard.title + '。' + currentCard.story);
}

// ── 語音設定面板 ──
const settingsToggle = document.getElementById('settingsToggle');
const settingsPanel  = document.getElementById('settingsPanel');
const rateSlider  = document.getElementById('rateSlider');
const pitchSlider = document.getElementById('pitchSlider');
const volSlider   = document.getElementById('volSlider');
const rateVal     = document.getElementById('rateVal');
const pitchVal    = document.getElementById('pitchVal');
const volVal      = document.getElementById('volVal');
const voiceSelect = document.getElementById('voiceSelect');
const testBtn     = document.getElementById('testBtn');

settingsToggle.addEventListener('click', () => {
  const open = settingsPanel.classList.toggle('open');
  settingsToggle.classList.toggle('open', open);
});

// 關閉面板（點外部）
document.addEventListener('click', e => {
  if (!settingsPanel.contains(e.target) && e.target !== settingsToggle) {
    settingsPanel.classList.remove('open');
    settingsToggle.classList.remove('open');
  }
});

rateSlider.addEventListener('input', () => {
  ttsRate = parseFloat(rateSlider.value);
  rateVal.textContent = ttsRate.toFixed(2);
});
pitchSlider.addEventListener('input', () => {
  ttsPitch = parseFloat(pitchSlider.value);
  pitchVal.textContent = ttsPitch.toFixed(2);
});
volSlider.addEventListener('input', () => {
  ttsVol = parseFloat(volSlider.value);
  volVal.textContent = ttsVol.toFixed(2);
});
voiceSelect.addEventListener('change', () => {
  const voices = window.speechSynthesis.getVoices();
  ttsVoice = voices.find(v => v.name === voiceSelect.value) || null;
});
testBtn.addEventListener('click', e => {
  e.stopPropagation();
  speak('山中小屋，事件卡語音測試。');
});

const clearDeckBtn = document.getElementById('clearDeckBtn');
clearDeckBtn.addEventListener('click', e => {
  e.stopPropagation();
  if (!confirm('確定要清空記錄，重新洗牌嗎？')) return;
  localStorage.removeItem(DECK_STORAGE_KEY);
  resetToBack();
  resetDeck();
  updateCounter();
});

// 載入語音清單
function loadVoices() {
  const voices = window.speechSynthesis.getVoices();
  if (!voices.length) return;
  voiceSelect.innerHTML = '';
  // 優先列中文語音，其次全部
  const zhVoices = voices.filter(v => v.lang.startsWith('zh'));
  const list = zhVoices.length ? zhVoices : voices;
  list.forEach(v => {
    const opt = document.createElement('option');
    opt.value = v.name;
    opt.textContent = v.name.length > 22 ? v.name.slice(0,22)+'…' : v.name;
    voiceSelect.appendChild(opt);
  });
  // 預設選第一個
  ttsVoice = list[0] || null;
}
window.speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

// ── 抽卡音效（Web Audio API 合成）──
function playDrawSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();

    // 低沉的翻牌摩擦聲 —— 噪音濾波
    const bufferSize = ctx.sampleRate * 0.18;
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1);

    const noise = ctx.createBufferSource();
    noise.buffer = buffer;

    const noiseFilter = ctx.createBiquadFilter();
    noiseFilter.type = 'bandpass';
    noiseFilter.frequency.setValueAtTime(320, ctx.currentTime);
    noiseFilter.frequency.linearRampToValueAtTime(80, ctx.currentTime + 0.18);
    noiseFilter.Q.value = 1.2;

    const noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(0.55, ctx.currentTime);
    noiseGain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.18);

    noise.connect(noiseFilter);
    noiseFilter.connect(noiseGain);
    noiseGain.connect(ctx.destination);
    noise.start();

    // 低沉神秘音調
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(110, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(55, ctx.currentTime + 0.5);

    const oscGain = ctx.createGain();
    oscGain.gain.setValueAtTime(0, ctx.currentTime);
    oscGain.gain.linearRampToValueAtTime(0.3, ctx.currentTime + 0.05);
    oscGain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.5);

    osc.connect(oscGain);
    oscGain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.5);

    // 微弱高頻泛音（神秘感）
    const osc2 = ctx.createOscillator();
    osc2.type = 'sine';
    osc2.frequency.setValueAtTime(440, ctx.currentTime);
    osc2.frequency.exponentialRampToValueAtTime(220, ctx.currentTime + 0.4);

    const osc2Gain = ctx.createGain();
    osc2Gain.gain.setValueAtTime(0.08, ctx.currentTime);
    osc2Gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.4);

    osc2.connect(osc2Gain);
    osc2Gain.connect(ctx.destination);
    osc2.start();
    osc2.stop(ctx.currentTime + 0.4);

  } catch(e) { /* 瀏覽器不支援時靜默略過 */ }
}

// ── 顯示卡片正面 ──
function revealCard() {
  if (deck.length === 0) resetDeck();
  const idx = deck.pop();
  saveDeck();
  currentCard = CARDS[idx];
  updateCounter();
  state = 'story';

  // 切換面
  cardBack.style.display = 'none';
  cardFront.classList.add('visible');
  ruleSection.classList.remove('visible');
  tapHint.classList.add('hidden');
  cardTitle.textContent = '';
  cardStory.textContent = '';
  ruleText.textContent = '';
  ttsBtn.classList.add('visible');

  // 先打 title、再打 story；語音只負責播放，不再擋住文字顯示
  // （iOS 第一次呼叫語音合成時，callback 有機率不觸發，若靠它接續打字會卡住）
  storyReady = false;
  typewrite(cardTitle, currentCard.title, 80, () => {
    speak(currentCard.title);
    typewrite(cardStory, currentCard.story, 35, () => {
      speak(currentCard.story);
      storyReady = true;
      tapHint.classList.remove('hidden');
    });
  });
}

// ── 顯示規則 ──
function showRule() {
  if (state !== 'story' || !storyReady) return;
  state = 'rule';
  tapHint.classList.add('hidden');
  ruleText.textContent = '';
  ruleSection.classList.add('visible');
  typewrite(ruleText, currentCard.rule, 28);
}

// ── 重置為背面 (下一張) ──
function resetToBack() {
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  if (typewriterTimer) { clearInterval(typewriterTimer); typewriterTimer = null; }
  state = 'back';
  currentCard = null;
  storyReady = false;

  cardFront.classList.remove('visible');
  ruleSection.classList.remove('visible');
  tapHint.classList.add('hidden');
  ttsBtn.classList.remove('visible');
  cardTitle.textContent = '';
  cardStory.textContent = '';
  ruleText.textContent = '';
  cardBack.style.display = '';

  cardWrap.style.transform = '';
}

// ── 拖曳翻牌 ──
let dragStartY = 0;
let dragCurY   = 0;
let dragging   = false;
const THRESHOLD = 90;

function onDragStart(y) {
  if (state !== 'back') return;
  dragging = true;
  dragStartY = y;
  dragCurY   = y;
  cardWrap.classList.add('dragging');
}

function onDragMove(y) {
  if (!dragging) return;
  dragCurY = y;
  const dy = Math.max(0, y - dragStartY);
  const capped = Math.min(dy, 130);
  const progress = Math.min(dy / THRESHOLD, 1);
  cardWrap.style.transform = `translateY(${capped * 0.6}px) scale(${1 - progress * 0.04})`;
}

function onDragEnd() {
  if (!dragging) return;
  dragging = false;
  cardWrap.classList.remove('dragging');
  const dy = dragCurY - dragStartY;
  if (dy >= THRESHOLD) {
    // 翻牌動畫
    playDrawSound();
    cardWrap.style.setProperty('--drag-end', `${Math.min(dy * 0.6, 80)}px`);
    cardWrap.style.transform = '';
    cardWrap.classList.add('flip-anim');
    cardWrap.addEventListener('animationend', () => {
      cardWrap.classList.remove('flip-anim');
      revealCard();
    }, { once: true });
  } else {
    // 彈回
    cardWrap.style.transition = 'transform 0.3s cubic-bezier(0.34,1.56,0.64,1)';
    cardWrap.style.transform = 'translateY(0) scale(1)';
    setTimeout(() => { cardWrap.style.transition = ''; }, 320);
  }
}

// 觸控
cardWrap.addEventListener('touchstart', e => onDragStart(e.touches[0].clientY), { passive: true });
cardWrap.addEventListener('touchmove',  e => { e.preventDefault(); onDragMove(e.touches[0].clientY); }, { passive: false });
cardWrap.addEventListener('touchend',   () => onDragEnd());

// 滑鼠
cardWrap.addEventListener('mousedown', e => onDragStart(e.clientY));
window.addEventListener('mousemove', e => { if (dragging) onDragMove(e.clientY); });
window.addEventListener('mouseup',   () => { if (dragging) onDragEnd(); });

// ── 點擊卡片正面查看規則 ──
cardFront.addEventListener('click', () => {
  if (state === 'story') showRule();
});

// ── 下一張按鈕 ──
nextBtn.addEventListener('click', () => {
  if (state === 'back') {
    playDrawSound();
    revealCard();
  } else {
    resetToBack();
  }
});

// ── 重播語音 ──
ttsBtn.addEventListener('click', e => { e.stopPropagation(); replayTTS(); });

// ── 初始化 ──
deck = loadDeck() || shuffle([...Array(CARDS.length).keys()]);
updateCounter();
</script>
